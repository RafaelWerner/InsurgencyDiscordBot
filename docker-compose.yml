version: '3.8'

services:
  app:
    build: .
    container_name: my_python_app
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    entrypoint: >
      sh -c "mkdir -p /app/logs &&
             LOG_FILE=/app/logs/$(date +%Y-%m-%d_%H-%M-%S).log &&
             python main.py > $LOG_FILE 2>&1"
